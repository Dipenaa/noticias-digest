  - contentinfo "Apple Footer" [ref=e252]:
    - generic [ref=e253]:
      - heading "Apple Footer" [level=2] [ref=e254]
      - region "Footnotes" [ref=e255]:
        - list [ref=e256]:
          - listitem [ref=e257]:
            - paragraph [ref=e258]: "Subject to credit approval. The cost of AirPods Pro 3, for purposes of this offer, does not include applicable taxes, fees, or other charges. Offer may be modified at any time and is not available to applicants who have had this card or who have another pending or approved application for the card. New Apple Card account owners who (1) first open a new Apple Card account and (2) then use it to buy AirPods Pro 3 directly from Apple, May 18, 2026, through June 15, 2026 (“Qualifying Period”), will qualify to earn up to $250 total Bonus Daily Cash after meeting the following spend requirements: beginning July 1, 2026, through April 30, 2027 (“Offer Period”), earn $25 Bonus Daily Cash each month when you use your new Apple Card to make a minimum of ten (10) purchases of any amount ($0.01 or higher) that post to your account each month (“Qualifying Purchases”). AirPods Pro 3 purchases must be made directly from Apple (online or in an Apple Store) using the new Apple Card. Refurbished products, other AirPods models, purchases from third‑party retailers, international purchases, and purchases for business purposes such as company bulk orders are excluded. All AirPods Pro 3 payment options from Apple using Apple Card are eligible for this offer including pay in full or financing via Apple Card Monthly Installments, and regardless of whether a trade-in value was applied to reduce the purchase cost. The qualifying AirPods Pro 3 purchase cannot be made entirely with an Apple Gift Card or Apple Account balance. The AirPods Pro 3 purchase does not count toward the ten (10) Qualifying Purchases required in any month during Offer Period. Returning the qualifying AirPods Pro 3 purchase may result in forfeiture of eligibility for this offer."
            - paragraph [ref=e259]:
              - text: To facilitate this offer and to confirm your AirPods Pro 3 purchase qualifies for this offer, Goldman Sachs will share certain Apple transaction information with Apple, and Apple will provide Goldman Sachs with a confirmation of your qualifying AirPods Pro 3 purchase. Any personal information processed by Apple or Goldman Sachs under this offer will be handled in accordance with the respective
              - link "Apple" [ref=e260] [cursor=pointer]:
                - /url: /legal/privacy/en-ww/
              - text: and
              - link "Goldman Sachs" [ref=e261] [cursor=pointer]:
                - /url: https://www.goldmansachs.com/privacy-and-cookies/Apple_Card_Privacy_Policy.pdf
              - text: privacy policies.
            - paragraph [ref=e262]:
              - text: Offer not available to Apple Card Family members added to, or merged with, an Apple Card account during the Offer Period.
              - generic [ref=e263]:
                - text: Qualifying Purchases can only be made by the new Apple Card account owner who opens a new Apple Card account during the Qualifying Period. New Apple Card account owner does
                - emphasis [ref=e264]: not
                - text: include Co-Owners or Participants added to an Apple Card Family during the Offer Period.
              - text: This means purchases made by Apple Card Family members will not be included toward the new Apple Card account owner’s Qualifying Purchases. Limit one offer per new Apple Card account. This offer can be combined with other Apple Card promotional offers during the Qualifying Period and the Offer Period. If you participate in other Apple Card promotions during the Qualifying Period and the Offer Period, the $25 Bonus Daily Cash earned under this offer will be awarded in addition to applicable Daily Cash earned under additional promotions. $25 Bonus Daily Cash is earned and transferred after the tenth purchase transaction is completed each month during the Offer Period. If a merchant chooses to combine separate charges into a single charge before processing the transaction, the combined transaction will only count as one single purchase transaction for purposes of this offer. For example, if you purchase three items using your Apple Card at the same merchant three separate times within one or more days, that merchant may combine those three transactions and submit them as a single transaction. In that case, that combined transaction will only count as one single purchase transaction in a given month for the applicable Offer Period. Returns and refunds of purchases during the Offer Period may impact your minimum monthly purchase qualification and result in a Daily Cash adjustment charge to your account. An additional purchase made within a given calendar month during the Offer Period may qualify you for re-fulfillment of the Bonus Daily Cash for a given month, but re-fulfillment may be delayed once Qualifying Purchases have posted to your new Apple Card account.
            - paragraph [ref=e265]:
              - text: You can choose to direct Daily Cash to a Savings account or to an Apple Cash account. If you do not have either set up to receive your Daily Cash, it can be applied as statement credit upon request. Apple Card is issued and Savings accounts are provided by Goldman Sachs Bank USA, Salt Lake City Branch, Member FDIC. The Apple Cash card is issued by Green Dot Bank, Member FDIC. Daily Cash is earned on purchases after the transaction posts to your account. Actual posting times vary by merchant. Daily Cash is subject to exclusions, and additional details apply. See the
              - link "Apple Card Customer Agreement" [ref=e266] [cursor=pointer]:
                - /url: https://www.goldmansachs.com/terms-and-conditions/Apple-Card-Customer-Agreement.pdf
              - text: for more information. If we determine that you have engaged in or plan to engage in abuse or gaming in connection with this offer, you will not be eligible for this offer.
            - paragraph [ref=e267]: Apple Payments Services LLC, a subsidiary of Apple Inc., is a service provider of Goldman Sachs Bank USA for Apple Card and Savings accounts. Apple Cash services are provided by Green Dot Bank, Member FDIC. Apple Payments Services LLC, a subsidiary of Apple Inc., is a service provider of Green Dot Bank for Apple Cash accounts. Neither Apple Inc. nor Apple Payments Services LLC is a bank.
          - listitem [ref=e268]: Trade‑in values will vary based on the condition, year, and configuration of your eligible trade‑in device. Not all devices are eligible for credit. You must be at least the age of majority to be eligible to trade in for credit or for an Apple Gift Card. Trade‑in value may be applied toward qualifying new device purchase, or added to an Apple Gift Card. Actual value awarded is based on receipt of a qualifying device matching the description provided when estimate was made. Sales tax may be assessed on full value of a new device purchase. In‑store trade‑in requires presentation of a valid photo ID (local law may require saving this information). Offer may not be available in all stores and may vary between in‑store and online trade‑in. Some stores may have additional requirements. Apple or its trade‑in partners reserve the right to refuse, cancel, or limit quantity of any trade‑in transaction for any reason. More details are available from Apple’s trade-in partner for trade‑in and recycling of eligible devices. Restrictions and limitations may apply.
